id: 'OMO-KB-SYNC'
title: 'omo 知识库同步 P1：git 兼容层 + 分支纪律 + 凭据存储/保护 + omo kb 子命令 + serve 定时'
state: '待确认'
level: 'L1'
created: '2026-09-17T06:47:26.425Z'
accept:
  - 'git 兼容层：探测 git 版本并退化——git -C（<1.8.5）改 Runner cwd、init -b（<2.28）改 init+symbolic-ref、pull --autostash（<2.6）改 stash/pull/pop；对 el7（git 1.8.3.1）三处均走退化分支'
  - '分支纪律：只 pull main；提交后只推 instance/<device>，绝不推 main（守卫断言 argv）'
  - '凭据存储：$OMO_DIR/kb/credential.json 与 git credentials 文件均 0600；两者加入 PathGuard 机密根（ops_file_* 读不到）'
  - 'omo kb sync|status|disable 子命令（启动器）+ ops_kb_sync 工具复用同一实现；status 输出 repo/branch/凭据前缀/最后同步/远端头/到期天数'
  - 'omo serve 启动时附带 KB 定时同步（默认 15min，可 --interval），pid 与日志落 /tmp，omo status 可见'
  - '守卫入 test: 'ci：git 兼容 argv/cwd 断言 + 本地裸仓端到端（真 git，无网络）+ 凭据权限与 PathGuard 拒读 + 启动器 kb 分支断言'''
