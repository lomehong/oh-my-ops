name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2   # 与安装器锁版一致（T3），消除构建/运行时版本分裂

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --ignore-scripts

      # 三步与 package.json 的 test:l1 / test:l2 / typecheck:core 同源（本地 pre-push 跑同一组脚本），
      # 避免 "本地 bun 过、CI node 不过" 的 runner 分裂（v0.8.0 首发即因此失败）
      - name: L1 测试
        run: npm run test:l1

      - name: L2 测试
        run: npm run test:l2

      - name: 类型检查
        run: npm run typecheck:core

  release:
    name: 打包发布
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2   # 构建 omp-single 运行时（与测试/安装器锁版一致）

      - uses: actions/setup-node@v4
        with:
          node-version: 22      # vendor 回归探针（node 夹具）用；与测试 job 同版本

      - name: 提取版本号
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # 自包含运行时：pin 18.1.18 → embedded-addon → 品牌 patch → bun compile 单文件（方案 §A.3）
      - name: 构建 omp 单文件运行时
        run: bash scripts/build-omp-runtime.sh

      # vendor 回归闸门（OMOVENDOR-1）：适配器回信修复（D1-D5）是 vendor 拷贝，上游「整文件同步」会静默回退。
      # 探针红 = 本次发布含回退版适配器 ⇒ 直接停止发布（发布包是发给对端装机的，静默回退=生产通讯失效）。
      # 这里直呼脚本（不走 npm script）：发布闸门不随 package.json 的改写而漂移。
      - name: vendor 适配器回归探针（回信帧 + close 码语义）
        run: node scripts/probe-yuyi-reply-frame.mjs

      # 打包结构 = git 仓库结构（install.sh 依赖相对路径 packages/…）+ 自包含运行时 omp-single
      - name: 打部署包
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG="oh-my-ops-${VERSION}"

          mkdir -p "/tmp/${PKG}"
          cp -r packages  "/tmp/${PKG}/packages"
          cp -r bin       "/tmp/${PKG}/bin"
          cp -r types     "/tmp/${PKG}/types"
          cp -r vendor    "/tmp/${PKG}/vendor"
          cp -r docs/examples "/tmp/${PKG}/examples"
          cp -r scripts   "/tmp/${PKG}/scripts"
          cp dist/omp-single "/tmp/${PKG}/omp-single"
          cp README.md    "/tmp/${PKG}/README.md"
          cp scripts/bootstrap.sh "$GITHUB_WORKSPACE/install.sh"

          # 打包清单断言（v0.7.0 首发曾丢 scripts/ —— 关键文件缺失直接红）
          # 品牌面断言（OMOBRAND-1）：启动器须拦截 update（防上游自更新击穿 pin）；二进制须含品牌 patch 痕迹
          grep -q 'update|upgrade)' scripts/install.sh || { echo "✗ 启动器缺 update|upgrade 拦截"; exit 1; }
          grep -qa 'OMO_APP_NAME' dist/omp-single || { echo "✗ 二进制未见品牌 patch 痕迹（OMO_APP_NAME）"; exit 1; }
          for f in "scripts/install.sh" "scripts/bootstrap.sh" "omp-single" "README.md" "packages/ops-extension/src/index.ts" \
                   "vendor/yuyi-omp-extension.js" "vendor/yuyi-omp-extension.sha256" "vendor/yuyi-omp-extension.PROVENANCE.md" \
                   "scripts/ops-kb-provision.mjs" "scripts/ops-kb-enroll-server.mjs" \
                   "scripts/install-enroll-service.sh" "scripts/probe-install-enroll-service.sh" "scripts/omo-kb-doctor.sh" \
                   "scripts/omo-kb-fleet.sh" "scripts/ui/index.html" "scripts/lib/kb-auth.mjs" "scripts/lib/kb-ui-config.mjs" \
                   "scripts/probe-kb-ui-render.mjs" "scripts/probe-kb-lint.sh" \
                   "scripts/lib/bun.sh" "scripts/lib/kb-audit.mjs" \
                   "scripts/lib/kb-gitea.mjs" "scripts/lib/kb-registry.mjs" \
                   "packages/ops-extension/src/kb-cli.ts" "packages/ops-extension/src/kb-sync.ts" \
                   "packages/ops-extension/src/kb-credential.ts" "packages/ops-extension/src/kb-enroll.ts" \
                   "packages/ops-extension/src/redact.ts" "packages/ops-core/src/redact.ts" \
                   "examples/redact-config.json.example"; do
            [ -e "/tmp/${PKG}/${f}" ] || { echo "✗ 打包缺关键文件：${f}"; exit 1; }
          done

          # 清除不需要的文件
          find "/tmp/${PKG}" -name "*.test.ts" -delete
          find "/tmp/${PKG}" -name "*.map" -delete

          cd /tmp
          tar czf "${PKG}.tar.gz" "${PKG}"
          # 发布包抽验（OMOVENDOR-1）：包内适配器指纹必须与清单一致（防打包期替换/夹带；与安装器闸门同判据）
          LISTED="$(awk '{print $1}' vendor/yuyi-omp-extension.sha256 | head -1)"
          IN_PKG="$(tar -xzOf "${PKG}.tar.gz" "${PKG}/vendor/yuyi-omp-extension.js" | sha256sum | awk '{print $1}')"
          [ "$IN_PKG" = "$LISTED" ] || { echo "✗ 发布包内适配器 sha256 与清单不符：${IN_PKG:0:16}… ≠ ${LISTED:0:16}…"; exit 1; }
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          mv "${PKG}.tar.gz" "${PKG}.tar.gz.sha256" "$GITHUB_WORKSPACE/"

      # 知识库自注册服务（kb-enroll）：独立小包，落地即「解包 → 一条命令安装」
      - name: 打 kb-enroll 服务包
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG="omo-kb-service-${VERSION}"
          mkdir -p "/tmp/${PKG}/lib"
          cp scripts/install-enroll-service.sh "/tmp/${PKG}/install.sh"
          cp scripts/ops-kb-enroll-server.mjs scripts/ops-kb-provision.mjs "/tmp/${PKG}/"
          cp scripts/omo-kb-fleet.sh "/tmp/${PKG}/"
          mkdir -p "/tmp/${PKG}/ui"
          cp scripts/ui/index.html "/tmp/${PKG}/ui/index.html"
          cp scripts/lib/kb-gitea.mjs scripts/lib/kb-registry.mjs scripts/lib/kb-audit.mjs scripts/lib/kb-auth.mjs scripts/lib/kb-ui-config.mjs scripts/lib/kb-lint.mjs scripts/lib/bun.sh "/tmp/${PKG}/lib/"
          # 清单断言：服务包缺任一关键文件即红（服务零外部依赖，lib/ 必须齐全）
          for f in install.sh ops-kb-enroll-server.mjs ops-kb-provision.mjs omo-kb-fleet.sh ui/index.html lib/kb-gitea.mjs lib/kb-registry.mjs lib/kb-audit.mjs lib/kb-auth.mjs lib/kb-ui-config.mjs lib/kb-lint.mjs lib/bun.sh; do
            [ -e "/tmp/${PKG}/${f}" ] || { echo "✗ 服务包缺文件：${f}"; exit 1; }
          done
          # 零依赖自检：服务在无 monorepo 的目录下也必须能加载（真机曾 Cannot find module）
          ( cd "/tmp/${PKG}" && bun -e "await import('./ops-kb-enroll-server.mjs').catch(e=>{ if(!String(e).includes('参数 --help')) { console.error(e); process.exit(1);} })" >/dev/null 2>&1 || true )
          cd /tmp
          tar czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          mv "${PKG}.tar.gz" "${PKG}.tar.gz.sha256" "$GITHUB_WORKSPACE/"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "oh-my-ops ${{ steps.ver.outputs.version }}"
          body: |
            ## oh-my-ops ${{ steps.ver.outputs.version }}
            ### 安装（一行命令，多通道自动回退，推荐）
            ```bash
            rm -f /tmp/omo-install.sh
            for u in "https://cdn.jsdelivr.net/gh/lomehong/oh-my-ops@main/scripts/bootstrap.sh" "https://fastly.jsdelivr.net/gh/lomehong/oh-my-ops@main/scripts/bootstrap.sh" "https://raw.githubusercontent.com/lomehong/oh-my-ops/main/scripts/bootstrap.sh"; do curl -fsSL --retry 3 --connect-timeout 8 "$u" -o /tmp/omo-install.sh && break; done
            [ -s /tmp/omo-install.sh ] && grep -q "omo 安装" /tmp/omo-install.sh && bash /tmp/omo-install.sh || echo "✗ bootstrap 下载失败：不要沿用旧文件"
            ```

            ### 短版（GitHub 访问稳定时）
            ```bash
            curl -fsSL https://github.com/lomehong/oh-my-ops/releases/latest/download/install.sh | bash
            ```

            ### 手动安装（等价）
            ```bash
            curl -L "https://github.com/lomehong/oh-my-ops/releases/download/${{ steps.ver.outputs.version }}/oh-my-ops-${{ steps.ver.outputs.version }}.tar.gz" | tar xz
            cd oh-my-ops-*
            bash scripts/install.sh
            ```

            ### 验证
            ```bash
            omo status
            omo -p "Use ops_file_read to read /etc/hostname"
            ```

            ### 知识库自注册服务（kb-enroll）一键部署
            ```bash
            curl -L "https://github.com/lomehong/oh-my-ops/releases/download/${{ steps.ver.outputs.version }}/omo-kb-service-${{ steps.ver.outputs.version }}.tar.gz" | tar xz
            cd omo-kb-service-*
            # 站点管理员凭据放 0600 文件；自签证书给 SAN（本机 IP 或域名）
            # 先签专用令牌（作用域：read:admin,write:admin,write:repository,write:organization）
            bash install.sh --api https://<你的Gitea>/git/api/v1 --repo <owner>/<repo> \
                 --admin-token-file /root/omo-kb.token \
                 --self-signed "<本机IP>" --host 0.0.0.0 --port 8787
            omo-kb status && omo-kb enroll-hint
            ```
          draft: false
          files: |
            install.sh
            oh-my-ops-*.tar.gz
            oh-my-ops-*.tar.gz.sha256
            omo-kb-service-*.tar.gz
            omo-kb-service-*.tar.gz.sha256
