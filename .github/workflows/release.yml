name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2   # 与安装器锁版一致（T3），消除构建/运行时版本分裂

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --ignore-scripts

      # 三步与 package.json 的 test:l1 / test:l2 / typecheck:core 同源（本地 pre-push 跑同一组脚本），
      # 避免 "本地 bun 过、CI node 不过" 的 runner 分裂（v0.8.0 首发即因此失败）
      - name: L1 测试
        run: npm run test:l1

      - name: L2 测试
        run: npm run test:l2

      - name: 类型检查
        run: npm run typecheck:core

  release:
    name: 打包发布
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2   # 构建 omp-single 运行时（与测试/安装器锁版一致）

      - name: 提取版本号
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # 自包含运行时：pin 18.1.18 → embedded-addon → 品牌 patch → bun compile 单文件（方案 §A.3）
      - name: 构建 omp 单文件运行时
        run: bash scripts/build-omp-runtime.sh

      # 打包结构 = git 仓库结构（install.sh 依赖相对路径 packages/…）+ 自包含运行时 omp-single
      - name: 打部署包
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG="oh-my-ops-${VERSION}"

          mkdir -p "/tmp/${PKG}"
          cp -r packages  "/tmp/${PKG}/packages"
          cp -r bin       "/tmp/${PKG}/bin"
          cp -r types     "/tmp/${PKG}/types"
          cp -r vendor    "/tmp/${PKG}/vendor"
          cp -r docs/examples "/tmp/${PKG}/examples"
          cp -r scripts   "/tmp/${PKG}/scripts"
          cp dist/omp-single "/tmp/${PKG}/omp-single"
          cp README.md    "/tmp/${PKG}/README.md"
          cp scripts/bootstrap.sh "$GITHUB_WORKSPACE/install.sh"

          # 打包清单断言（v0.7.0 首发曾丢 scripts/ —— 关键文件缺失直接红）
          # 品牌面断言（OMOBRAND-1）：启动器须拦截 update（防上游自更新击穿 pin）；二进制须含品牌 patch 痕迹
          grep -q 'update|upgrade)' scripts/install.sh || { echo "✗ 启动器缺 update|upgrade 拦截"; exit 1; }
          grep -qa 'OMO_APP_NAME' dist/omp-single || { echo "✗ 二进制未见品牌 patch 痕迹（OMO_APP_NAME）"; exit 1; }
          for f in "scripts/install.sh" "scripts/bootstrap.sh" "omp-single" "README.md" "packages/ops-extension/src/index.ts" \
                   "scripts/ops-kb-provision.mjs" "scripts/ops-kb-enroll-server.mjs" \
                   "scripts/lib/kb-gitea.mjs" "scripts/lib/kb-registry.mjs" \
                   "packages/ops-extension/src/kb-cli.ts" "packages/ops-extension/src/kb-sync.ts" \
                   "packages/ops-extension/src/kb-credential.ts" "packages/ops-extension/src/kb-enroll.ts"; do
            [ -e "/tmp/${PKG}/${f}" ] || { echo "✗ 打包缺关键文件：${f}"; exit 1; }
          done

          # 清除不需要的文件
          find "/tmp/${PKG}" -name "*.test.ts" -delete
          find "/tmp/${PKG}" -name "*.map" -delete

          cd /tmp
          tar czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          mv "${PKG}.tar.gz" "${PKG}.tar.gz.sha256" "$GITHUB_WORKSPACE/"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "oh-my-ops ${{ steps.ver.outputs.version }}"
          body: |
            ## oh-my-ops ${{ steps.ver.outputs.version }}
            ### 安装（一行命令，多通道自动回退，推荐）
            ```bash
            for u in "https://cdn.jsdelivr.net/gh/lomehong/oh-my-ops@main/scripts/bootstrap.sh" "https://fastly.jsdelivr.net/gh/lomehong/oh-my-ops@main/scripts/bootstrap.sh" "https://raw.githubusercontent.com/lomehong/oh-my-ops/main/scripts/bootstrap.sh"; do curl -fsSL --retry 3 --connect-timeout 8 "$u" -o /tmp/omo-install.sh && break; done; bash /tmp/omo-install.sh
            ```

            ### 短版（GitHub 访问稳定时）
            ```bash
            curl -fsSL https://github.com/lomehong/oh-my-ops/releases/latest/download/install.sh | bash
            ```

            ### 手动安装（等价）
            ```bash
            curl -L "https://github.com/lomehong/oh-my-ops/releases/download/${{ steps.ver.outputs.version }}/oh-my-ops-${{ steps.ver.outputs.version }}.tar.gz" | tar xz
            cd oh-my-ops-*
            bash scripts/install.sh
            ```

            ### 验证
            ```bash
            omo status
            omo -p "Use ops_file_read to read /etc/hostname"
            ```
          draft: false
          files: |
            install.sh
            oh-my-ops-*.tar.gz
            oh-my-ops-*.tar.gz.sha256
